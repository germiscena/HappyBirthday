<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121016" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Дорога жизни - путь к 23</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Container for PixiJS Canvas -->
  <div id="game-container"></div>

  <!-- Mobile Orientation Overlay (shown only in portrait mode on mobile) -->
  <div id="orientation-overlay" class="hidden">
    <div class="orientation-card">
      <div class="phone-rotate-icon">📲</div>
      <h2>Поверните телефон</h2>
      <p>Для погружения в историю разверните устройство горизонтально</p>
    </div>
  </div>

  <!-- Start Screen Overlay -->
  <div id="start-screen">
    <div class="start-content">
      <h1 class="game-title">Дорога жизни</h1>
      <h2 class="game-subtitle">Путь к 23</h2>
      <p class="game-description">История одной прекрасной жизни</p>
      <button id="btn-start" class="btn-start-game">Начать путешествие</button>
      <p class="start-hint">✨ Со всеми персонажами можно взаимодействовать</p>
    </div>
  </div>

  <!-- In-game HTML Overlay (Dialog Bubbles & Notifications) -->
  <div id="ui-layer"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
